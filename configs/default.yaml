project:
  name: ustc_mm26_sfm_3dgs
  random_seed: 42

sfm:
  feature_type: rootsift
  max_image_size: 1600
  ratio_test: 0.8
  mutual_check: true
  min_num_matches: 30
  min_num_inliers: 30
  ransac_confidence: 0.999
  ransac_reproj_threshold_px: 4.0
  homography_reproj_threshold_px: 4.0
  essential_reproj_threshold_px: 4.0
  homography_ratio_threshold: 0.8
  essential_ratio_threshold: 0.6
  panoramic_triangulation_angle_deg: 1.0
  wtf_border_ratio: 0.1
  wtf_similarity_ratio_threshold: 0.7
  min_triangulation_angle_deg: 1.5
  max_reproj_error_px: 8.0
  min_track_length: 2

camera:
  model: SIMPLE_PINHOLE
  estimate_focal_from_exif: true
  fix_principal_point: true
  optimize_focal_length: false
  optimize_distortion: false

bundle_adjustment:
  local_ba_after_each_registration: true
  global_ba_growth_ratio: 1.1
  robust_loss: cauchy
  max_iterations: 100

export:
  format: colmap_text
  write_ply: true
  compatible_with_3dgs: true
